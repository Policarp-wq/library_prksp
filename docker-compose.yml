services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${PGUSER:?Set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./node-postgres
      dockerfile: Dockerfile
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./node-postgres
      dockerfile: Dockerfile
    command: ["node", "dist/scripts/seed.js"]
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./node-postgres
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
